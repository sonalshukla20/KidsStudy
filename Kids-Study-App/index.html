<title>Magical Olympiad World</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one centred column of big rounded play cards under a slim sticky bar; every control is finger-sized. */
:root{--sky:#EAF3FF;--sky2:#D9E8FF;--card:#FFFFFF;--tile:#F3F7FF;--ink:#1F2552;--ink2:#565C8A;--line:#C5D5F5;--blue:#2F7BF5;--blue-d:#1D5AC2;--on-blue:#FFFFFF;--purple:#7B4FE0;--purple-d:#5A34B8;--on-purple:#FFFFFF;--yellow:#FFC93C;--yellow-d:#DDA20F;--on-yellow:#3B2A00;--mint:#3ED6A8;--mint-d:#1FA880;--on-mint:#04382A;--good:#128A5E;--good-bg:#DCF7EA;--oops:#C2571B;--oops-bg:#FFE9DA;--info-bg:#EDE6FF;--sel:#E4DAFF;--trace:#CFE0FF;--shadow:rgba(47,80,160,.16);

:root[data-theme="dark"]{--sky:#12162F;--sky2:#1A2046;--card:#222956;--tile:#2B3368;--ink:#F2F5FF;--ink2:#B6BEE8;--line:#404A8A;--blue:#6AA5FF;--blue-d:#3F78D6;--on-blue:#0B1230;--purple:#A98BFF;--purple-d:#7A5CD6;--on-purple:#150B33;--yellow:#FFD45E;--yellow-d:#C99A1E;--on-yellow:#3B2A00;--mint:#4FE0B5;--mint-d:#27A983;--on-mint:#04382A;--good:#5BE3AE;--good-bg:#17463A;--oops:#FFAA78;--oops-bg:#4B2E20;--info-bg:#33295F;--sel:#3D3380;--trace:#35407E;--shadow:rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}

button{cursor:pointer}

#app{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 40px}

.bubble b{font-family:var(--display);font-size:1.3rem;color:var(--blue)}
.av .arm{transform-origin:96px 124px}.av.wave .arm{animation:wave 1.4s ease-in-out infinite}
@keyframes wave{50%{rotate:-18deg}}
.who{position:relative;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.mini{display:inline-flex}
.namef{position:relative;display:flex;flex-direction:column;gap:8px;font-weight:700}.namef div{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
input,select{min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:6px 14px;max-width:100%}
.hero .cta{position:relative}
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:18px}
.world,.cont{display:flex;align-items:center;gap:14px;text-align:left;border:0;border-radius:26px;padding:18px;box-shadow:0 6px 0 var(--blue-d);background:var(--blue);color:var(--on-blue);min-width:0}
.world.ma{background:var(--purple);color:var(--on-purple);box-shadow:0 6px 0 var(--purple-d)}
.wi{font-size:2.6rem;line-height:1;flex:none}
.wt{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}.wt b,.cont b{font-family:var(--display);font-size:1.5rem;line-height:1.1}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.35);overflow:hidden}.bar i{display:block;height:100%;background:var(--yellow);border-radius:99px}
.goalc{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:26px;padding:14px 18px;box-shadow:0 6px 0 var(--line)}

/* dashboard */
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 16px}
.tab{flex:1;min-width:150px;min-height:60px;border-radius:20px;border:3px solid var(--line);background:var(--card);font-family:var(--display);font-weight:800;font-size:1.2rem}
.tab.on{background:var(--purple);color:var(--on-purple);border-color:var(--purple-d)}
.cont{width:100%;background:var(--yellow);color:var(--on-yellow);box-shadow:0 6px 0 var(--yellow-d)}.cont span:nth-child(2){display:flex;flex-direction:column;flex:1;min-width:0}.goarrow{font-size:1.8rem}
.sec{font-size:1.5rem;margin:26px 0 4px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:14px}
.tcard{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"i n" "i s" "m m";gap:2px 12px;align-items:center;text-align:left;border:3px solid var(--line);border-radius:24px;background:var(--card);padding:14px 14px 12px;box-shadow:0 5px 0 var(--line);min-width:0}

.badge{background:var(--card);border-radius:20px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;opacity:.55;border:2px dashed var(--line)}

.panel{background:var(--card);border-radius:30px;padding:24px 20px;box-shadow:0 8px 24px var(--shadow);display:flex;flex-direction:column;gap:16px;margin-top:8px}

.looks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.lookc{background:var(--tile);border-radius:24px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.swr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}.swr small{width:100%;text-align:center;color:var(--ink2);font-weight:700}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line);display:inline-block}button.sw.sel{box-shadow:0 0 0 4px var(--purple)}

.qmeta{display:flex;gap:6px;flex-wrap:wrap}
.qhead{display:flex;gap:12px;align-items:flex-start}.qtext{flex:1;min-width:0}.ib.spk{background:var(--yellow);box-shadow:0 4px 0 var(--yellow-d)}
.qp{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,4.2vw,2rem);line-height:1.2;text-wrap:balance}
.qh{font-family:var(--display);font-size:1.2rem;color:var(--ink2);margin-top:4px}

/* content bits */
.em{display:inline-block;font-size:2.6rem;line-height:1.15;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.tx{font-family:var(--body);font-weight:700;font-size:2.2rem;line-height:1.1}.tx.word{font-size:1.5rem}

.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}

.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:center}.row.end{align-items:flex-end}.vs{font-weight:700;color:var(--ink2)}
.listen{min-height:56px;padding:8px 18px;border-radius:99px;border:0;background:var(--yellow);color:var(--on-yellow);box-shadow:0 4px 0 var(--yellow-d);font-weight:700;font-size:1.2rem}
.dotl{color:var(--purple)}.dsvg{color:var(--ink)}.shp{display:block}
.pole{display:inline-flex;flex-direction:column;align-items:center}.pole .em{font-size:2rem;margin-bottom:-6px}.pole i{width:9px;border-radius:5px}
.scale{display:inline-flex;flex-direction:column;align-items:center;padding-top:26px}.beam{width:210px;height:8px;border-radius:4px;background:var(--ink2);display:flex;justify-content:space-between;rotate:calc(var(--t)*9deg)}
.pan{width:64px;height:64px;margin-top:-58px;display:grid;place-items:end center;rotate:calc(var(--t)*-9deg);border-bottom:5px solid var(--ink2);border-radius:0 0 14px 14px}.pan .em{font-size:2.2rem}.post{width:10px;height:54px;background:var(--ink2);border-radius:0 0 6px 6px}
.glass{display:inline-block;width:44px;height:58px;border:4px solid var(--ink2);border-top:0;border-radius:4px 4px 12px 12px;background:transparent}.glass.full{background:linear-gradient(var(--blue),var(--blue)) bottom/100% 86% no-repeat}

.key{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.key span{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:4px 14px;font-size:1.7rem;font-weight:700}
.cgrid{display:inline-grid;gap:4px;padding:6px;border-radius:12px;background:var(--ink2)}.cgrid i{display:grid;place-items:center;border-radius:6px;background:var(--card);font-style:normal;font-weight:800;color:var(--purple)}
.sw[role=img]{width:54px;height:54px;border-radius:14px}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:14px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{min-height:88px;min-width:0;padding:10px;border-radius:22px;border:3px solid var(--line);background:var(--tile);box-shadow:0 5px 0 var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink);user-select:none;-webkit-user-select:none}
.opt.drag,.pcol.drag{touch-action:none}.opt.dragging,.pcol.dragging{z-index:30;position:relative;box-shadow:0 14px 24px var(--shadow);cursor:grabbing}
.opt.sel{border-color:var(--purple);background:var(--sel);box-shadow:0 5px 0 var(--purple-d)}
.opt.good{border-color:var(--good);background:var(--good-bg);box-shadow:0 5px 0 var(--good)}
.opt.bad{opacity:.38;border-style:dashed;box-shadow:none}.opt.fix{border-color:var(--yellow-d)}
.opt.mini{min-height:56px;min-width:56px;padding:4px;border-radius:16px}.opt.mini .em{font-size:1.8rem}

.opts.line{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;border-top:6px solid var(--ink2);padding-top:14px;margin-top:8px}.opts.line .opt{min-height:64px;padding:4px}.opts.line .tx{font-size:1.6rem}

/* ---- html builders ---- */
const E=(e,c)=>`<span class="em${c?' '+c:''}">${e}</span>`;
const T=(s,c)=>`<span class="tx${c?' '+c:''}">${s}</span>`;
const Wd=w=>T(w,'word');
const PW=w=>`<span class="pw"><span class="em">${WORDS[w]}</span><small>${w}</small></span>`;
const PN=(n,e)=>`<span class="pw"><span class="em">${e}</span><small>${n}</small></span>`;
const seq=a=>`<div class="seq">${a.map(x=>`<span class="tile${x==='?'?' q':''}">${x}</span>`).join('')}</div>`;
const grp=(e,n,tap)=>`<span class="grp${tap?' tap':''}" style="--c:${Math.min(n,5)}">${Array.from({length:n},()=>`<span class="em">${e}</span>`).join('')}</span>`;
const LB=(say,cap)=>`<button type="button" class="listen" data-say="${say}">🔊 <span>${cap}</span></button>`;
const dotL=(ch,s=76)=>`<svg class="dotl" viewBox="0 0 100 100" width="${s}" height="${s}" role="img" aria-label="dotted ${ch}"><text x="50" y="80" text-anchor="middle" font-size="84" font-weight="700" fill="none" stroke="currentColor" stroke-width="2.4" stroke-dasharray="1 5.5" stroke-linecap="round">${ch}</text></svg>`;
function shp(k,c='#2F7BF5',s=64,o){const st=o?`fill="none" stroke="${c}" stroke-width="5" stroke-dasharray="7 6"`:`fill="${c}"`;const P={circle:`<circle cx="50" cy="50" r="42" ${st}/>`,square:`<rect x="12" y="12" width="76" height="76" rx="4" ${st}/>`,triangle:`<polygon points="50,10 92,88 8,88" ${st}/>`,rectangle:`<rect x="4" y="26" width="92" height="48" rx="4" ${st}/>`,oval:`<ellipse cx="50" cy="50" rx="46" ry="28" ${st}/>`,star:`<polygon points="50,6 61,38 95,38 67,58 78,91 50,71 22,91 33,58 5,38 39,38" ${st}/>`,heart:`<path d="M50 88 C10 58 4 34 18 20 C30 8 46 14 50 28 C54 14 70 8 82 20 C96 34 90 58 50 88Z" ${st}/>`,diamond:`<polygon points="50,6 86,50 50,94 14,50" ${st}/>`};return `<svg class="shp" viewBox="0 0 100 100" width="${s}" height="${s}" role="img" aria-label="${k}">${P[k]}</svg>`}
const pole=(k,hg)=>`<span class="pole"><span class="em">${k[1]}</span><i style="height:${hg}px;background:${k[2]}"></i></span>`;
const scale=(a,b,t)=>`<span class="scale" style="--t:${t}"><span class="beam"><span class="pan">${a}</span><span class="pan">${b}</span></span><span class="post"></span></span>`;
const sz=(e,k)=>`<span class="em" style="font-size:${k}rem">${e}</span>`,SZ=[1.3,2,2.8,3.7,4.7];
const graph=rows=>`<div class="graph">${rows.map(([e,n])=>`<div class="grow"><b>${e}</b>${Array.from({length:6},(_,i)=>`<span class="gc">${i<n?e:''}</span>`).join('')}</div>`).join('')}</div>`;
const keyH=k=>`<div class="key">${k.map(([s,n])=>`<span>${s} = <b>${n}</b></span>`).join('')}</div>`;
const gridH=(cells,cols,s=30)=>`<span class="cgrid" style="grid-template-columns:repeat(${cols},${s}px)">${cells.map(c=>`<i style="height:${s}px;${c?'background:'+c:''}">${c?'':'?'}</i>`).join('')}</span>`;
function hopRows(n){const rows=[];let i=0,k=0;const pat=[1,1,2,1,2,1,2,1,2];while(i<n){const c=Math.min(pat[k++%pat.length],n-i);rows.push(Array.from({length:c},(_,j)=>i+j));i+=c}return rows.reverse()}
const hopB=(labels,blank)=>`<div class="hopb">${hopRows(labels.length).map(r=>`<div>${r.map(i=>`<span class="hopt${i==blank?' q':''}">${i==blank?'?':labels[i]}</span>`).join('')}</div>`).join('')}</div>`;
const dotsSvg=pts=>`<svg class="dsvg" viewBox="0 0 100 100" width="150" height="150" role="img" aria-label="numbered dots">${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="currentColor"/><text x="${p[0]}" y="${p[1]-7}" font-size="11" font-weight="700" text-anchor="middle" fill="currentColor">${i+1}</text>`).join('')}</svg>`;

/* ---- question builders ---- */
function mc(r,p,h,ok,bad,x){const opts=r.shuffle([ok,...bad]);return Object.assign({t:'mcq',p,h,opts,a:opts.indexOf(ok)},x)}
function mcN(p,h,opts,a,x){return Object.assign({t:'mcq',p,h,opts,a},x)}
function fl(r,p,h,parts,ok,bad,x){const opts=r.shuffle([ok,...bad]);return Object.assign({t:'fill',p,h,parts,opts,a:opts.indexOf(ok)},x)}
function ord(r,p,h,items,x){let sh,n=0;do{sh=r.shuffle(items.map((_,i)=>i))}while(sh.every((v,i)=>items[v]===items[i])&&++n<30);return Object.assign({t:'order',p,h,items,sh},x)}
function srt(r,p,h,bins,items,x){return Object.assign({t:'sort',p,h,bins,items:r.shuffle(items)},x)}
function mat(r,p,h,pairs,x){let ro,n=0;do{ro=r.shuffle(pairs.map((_,i)=>i))}while(ro.every((v,i)=>v===i)&&++n<30);return Object.assign({t:'match',p,h,pairs,ro},x)}
function near(r,n,lo,hi,ex=[],k=2){const c=[];for(let d=1;d<=6&&c.length<Math.max(4,k+1);d++)[n-d,n+d].forEach(v=>{if(v>=lo&&v<=hi&&!ex.includes(v))c.push(v)});return r.sample(c,k)}
const nearL=(r,i,ex=[],k=2)=>near(r,i,0,25,ex,k);
const sg=w=>w[0]=='k'?'c':w[0];
const bsBy=l=>BS.filter(w=>w[0]==l);
const famOf=w=>RHY.findIndex(f=>f.includes(w));
const safeV=w=>[...VOW].filter(v=>v!=w[1]&&!W3.has(w[0]+v+w[2]));
const TOPICS=[];const topic=o=>TOPICS.push(o);

/* ---------- practice session ---------- */
function pickQ(tp,L,used,ok){const f=q=>!used.has(q.id)&&(!ok||ok(q));let c=BANK[tp.id].filter(q=>q.L==L&&f(q));if(!c.length){for(let i=0;i<40;i++){const q=freshQ(tp,L);if(!ok||ok(q))return q}c=BANK[tp.id].filter(f);if(!c.length)c=BANK[tp.id].filter(q=>!ok||ok(q))}const q=c[Math.floor(Math.random()*c.length)];used.add(q.id);return q}
function pickTopic(s){const l=TOPICS.filter(t=>t.s==s),w=l.map(t=>{const x=S.topics[t.id];return !x||!x.seen?2:x.right/x.seen<.6?3:1});let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<l.length;i++){r-=w[i];if(r<=0)return l[i]}return l[0]}
function startSession(o){PL=Object.assign({i:0,served:0,used:new Set(),queue:[],res:[],stars:0},o);go('play')}
function nextItem(){const d=PL.queue.findIndex(x=>x.due<=PL.served);if(d>=0)return PL.queue.splice(d,1)[0];if(PL.i>=PL.count)return PL.queue.shift()||null;let q;if(PL.fixed)q=PL.fixed[PL.i];else{const tp=PL.topic?TP[PL.topic]:pickTopic(PL.subj);q=pickQ(tp,S.set.diff||ts(tp.id).lvl,PL.used)}PL.i++;return {q,retry:false}}
function qCard(q,cx,tag){const tp=TP[q.topic],card=h('div','qcard');
 card.innerHTML=`<div class="qmeta"><span class="chip">${tp.icon} ${tp.name}</span><span class="chip lv${q.L}">${LV[q.L]}</span>${tag||''}</div><div class="qhead"><button class="ib spk" data-act="sayq" aria-label="Hear the question">🔊</button><div class="qtext"><p class="qp">${q.p}</p>${S.set.hi?`<p class="qh" lang="hi">${q.h}</p>`:''}</div></div>${q.stim?`<div class="stim">${q.stim}</div>`:''}<div class="wbox"></div>${HOW[q.t]?`<p class="how">${HOW[q.t]}</p>`:''}<div class="fb" aria-live="polite"></div>`;
 const w=makeWidget(q,cx);$('.wbox',card).append(w.el);let cnt=0;$$('.stim .grp.tap .em',card).forEach(e=>{e.tabIndex=0;e.setAttribute('role','button');const f=()=>{if(e.dataset.n)return;e.dataset.n=++cnt;TTS.say(String(cnt),'en')};e.addEventListener('click',f);e.addEventListener('keydown',k=>{if(k.key=='Enter')f()})});return {card,w,q}}
function pips(){const o=PL.res.filter(r=>!r.retry);$('#pips').innerHTML=Array.from({length:PL.count},(_,i)=>`<i class="${o[i]?(o[i].first?'ok':'no'):i==o.length&&!PL.cur.retry?'cur':''}"></i>`).join('');$('#pstar').textContent='⭐ '+PL.stars}
function advance(){const it=nextItem();if(!it)return finishSession();PL.served++;PL.cur=it;it.att=0;it.done=false;let c=null;c=qCard(it.q,{change(){if(!c||it.done)return;const w=c.w;if(w.auto){if(w.complete())submit()}else $('#bcheck').disabled=!w.complete()}},it.retry?'<span class="chip okc">↻ One more try</span>':'');CUR=c;const host=$('#qhost');host.innerHTML='';host.append(c.card);c.w.shown&&c.w.shown();$('#bnext').hidden=true;$('#bhint').hidden=false;$('#bcheck').hidden=!!c.w.auto;$('#bcheck').disabled=true;pips();sayQ(it.q)}
const PR=['Great job!','Wonderful!','You did it!','Super!','Brilliant!'],PRH=['शाबाश!','बहुत बढ़िया!','वाह, सही जवाब!'];
function fb(cls,head,body){$('.fb',CUR.card).innerHTML=`<div class="fbx ${cls}"><b>${head}</b>${body?`<span>${body}</span>`:''}</div>`}
function submit(){const it=PL.cur,w=CUR.w,q=it.q;if(it.done||!w.complete())return;
 if(w.correct()){it.done=true;w.reveal();w.lock();const first=it.att==0,p=PR[Math.floor(Math.random()*PR.length)];sfx('good');if(first)confetti(14);fb('good',p+(S.set.hi?' '+PRH[Math.floor(Math.random()*3)]:'')+' ⭐',q.e);TTS.say(p,'en');record(it,first,true);if(!first&&!it.retry&&PL.queue.length<4)PL.queue.push({q,retry:true,due:PL.served+3});endQ()}
 else{it.att++;sfx('oops');if(it.att<2){w.wrong();fb('oops',"Let's try again!"+(S.set.hi?' चलो फिर से कोशिश करें!':''),q.hint||DHINT[q.t]);TTS.say("Let's try again!",'en');if(!w.auto)$('#bcheck').disabled=!w.complete()}
  else{it.done=true;w.reveal();w.lock();fb('info','Good try! Here is the answer.',q.e);TTS.say('Good try! Here is the answer.','en');record(it,false,false);if(!it.retry&&PL.queue.length<4)PL.queue.push({q,retry:true,due:PL.served+3});endQ()}}}
function endQ(){$('#bcheck').hidden=true;$('#bhint').hidden=true;const n=$('#bnext');n.hidden=false;n.focus({preventScroll:true});pips();save()}
function record(it,first,ok){const t=ts(it.q.topic);if(!it.retry){t.seen++;if(first){t.right++;t.streak++;t.miss=0;if(!S.set.diff&&t.streak>=3&&t.lvl<3){t.lvl++;t.streak=0;toast(`Level up! ${LV[t.lvl]} unlocked in ${TP[it.q.topic].name} 🎉`)}}else{t.streak=0;t.miss++;if(!S.set.diff&&t.miss>=2&&t.lvl>1){t.lvl--;t.miss=0}}}else if(ok)S.retryWins++;if(ok){addStar();PL.stars++}PL.res.push({q:it.q,first:first&&ok,ok,retry:it.retry})}

 hint(){const q=CUR.q,w=CUR.w;if(PL.cur.done)return;w.hint&&w.hint();fb('info','💡 Hint',q.hint||DHINT[q.t]);TTS.say(q.hint||DHINT[q.t],'en')},
 quit(){if(PL.res.length)finishSession();else go(PL.topic?'dash':'home')},
 again(){startSession({mode:PL.mode,topic:PL.topic,subj:PL.subj,count:S.set.qn})},
 retrymiss(){const m=PL.res.filter(r=>!r.retry&&!r.first).map(r=>r.q);startSession({mode:'retry',fixed:m,count:m.length,topic:PL.topic,subj:PL.subj,isRetry:true})},
 startmock:d=>startMock(d.s,+d.n),mprev(){if(MK.i>0)mockShow(MK.i-1)},mnext(){MK.i<MK.items.length-1?mockShow(MK.i+1):go('mockcheck')},
 mjump(d){if(VIEW!='mock'){MK.i=+d.i;go('mock')}else mockShow(+d.i)},mfinish:()=>go('mockcheck'),msubmit:()=>mockSubmit(),mres:()=>go('mockres'),review:d=>go('review',{i:d.i}),
 mretry(){const m=MK.items.filter(it=>!it.ok).map(it=>it.q);startSession({mode:'retry',fixed:m,count:m.length,subj:MK.subj,isRetry:true})},
 reset1(){$('#rst').innerHTML='<b>Erase all stars, levels and test history?</b> <button class="btn danger" data-act="reset2">Yes, erase everything</button> <button class="btn ghost" data-act="parentv">Cancel</button>'},
 reset2(){const keep={name:S.name,av:S.av,me:S.me,set:S.set};S=Object.assign(DEF(),keep);save();go('parent');toast('Progress has been reset.')},parentv:()=>go('parent')
};
document.addEventListener('click',e=>{const s=e.target.closest('[data-say]');if(s){TTS.say(s.dataset.say,'en');return}const a=e.target.closest('[data-act]');if(a&&!a.disabled&&ACT[a.dataset.act])ACT[a.dataset.act](a.dataset,a)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-set]');if(!el)return;const k=el.dataset.set,v=el.value;if(k=='name')S.name=v.trim();else if(k=='vol')S.set.vol=+v;else if(v=='true'||v=='false')S.set[k]=v=='true';else S.set[k]=+v;save();if(k=='hi'||k=='sound')go('parent')});
load();TTS.init();
const start=()=>go('home');
window.claude&&window.claude.hot&&window.claude.hot.ready?window.claude.hot.ready(start):start();
</script>
